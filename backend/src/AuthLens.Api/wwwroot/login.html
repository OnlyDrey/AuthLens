<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · AuthLens</title>
  <link rel="stylesheet" href="/login.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <header><h1><img class="brand-icon" src="/logo.png" width="32" height="32" alt=""> AuthLens <span class="tag">.NET server</span></h1></header>
  <main class="login">
    <h2>Sign in</h2>
    <p>Enter the server access token (environment variable <code>AUTHLENS_TOKEN</code> or the <code>api-token</code> file in the data directory).
      The token is sent once to the server, which answers with an HttpOnly session cookie; page script never handles it.</p>
    <form method="post" action="/auth/login">
      <label>Access token <input type="password" name="token" autocomplete="off" required minlength="32"></label>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
